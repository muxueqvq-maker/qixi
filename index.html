<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>七夕快乐 · 浪漫星河</title>
<style>
  :root {
    --pw: clamp(118px, 18vmin, 225px);
    --ph: clamp(148px, 23vmin, 285px);
    --rz: clamp(150px, 30vmin, 360px);
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, sans-serif;
    color: #fff;
    background:
      radial-gradient(1200px 800px at 50% 28%, #43132f 0%, #24103a 48%, #080312 100%);
    user-select: none;
  }

  .white-cover {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: #fff;
    opacity: 1;
    pointer-events: none;
    transition: opacity 0.9s ease;
  }

  .white-cover.hidden {
    opacity: 0;
  }

  #hearts {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .stage {
    position: fixed;
    inset: 0;
    z-index: 1;
  }

  .ring-scene {
    position: absolute;
    left: 50%;
    top: 50vh;
    width: 0;
    height: 0;
    perspective: 1500px;
    transform-style: preserve-3d;
  }

  .ring {
    position: absolute;
    left: 0;
    top: 0;
    width: 0;
    height: 0;
    transform-style: preserve-3d;
    will-change: transform;
    transform: rotateX(-14deg);
    animation: ring-rotate 20s linear 2s infinite;
  }

  @keyframes ring-rotate {
    from { transform: rotateX(-14deg) rotateY(0deg); }
    to { transform: rotateX(-14deg) rotateY(360deg); }
  }

  .photo-wrap {
    position: absolute;
    left: 0;
    top: 0;
    width: var(--pw);
    height: var(--ph);
    margin-left: calc(var(--pw) / -2);
    margin-top: calc(var(--ph) / -2);
    transform: rotateY(var(--a)) translateZ(var(--rz));
    transform-style: preserve-3d;
    will-change: transform;
  }

  .photo-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }

  .photo-face.back {
    transform: rotateY(180deg);
  }

  .photo-card {
    width: 100%;
    height: 100%;
    border-radius: 18px;
    overflow: hidden;
    border: 3px solid rgba(255, 255, 255, 0.7);
    box-shadow:
      0 18px 45px rgba(0, 0, 0, 0.45),
      0 0 35px rgba(255, 105, 145, 0.45);
    opacity: 0;
    animation: fadein 0.9s ease var(--fd) forwards;
  }

  .photo-card img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  @keyframes fadein {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes slide-in-right {
    from { transform: translateX(80px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  .heart-particle {
    position: absolute;
    left: 50%;
    top: 50%;
    z-index: 3;
    width: clamp(300px, 50vmin, 620px);
    height: clamp(280px, 43vmin, 540px);
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  #heartCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .heart-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    transform: translateY(-5%);
    font-family: "华文行楷", "STXingkai", "楷体", "KaiTi", "华文隶书", "STLiti", cursive;
    font-size: clamp(26px, 5vmin, 48px);
    font-weight: 800;
    gap: 0.08em;
  }

  .heart-char {
    display: inline-block;
    position: relative;
    background: linear-gradient(110deg, #ffffff 0%, #eef8ff 20%, #cfeaff 38%, #9ed8ff 55%, #d7ecff 74%, #ffffff 100%);
    background-size: 100% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    filter:
      drop-shadow(-1px 0 0 rgba(0, 0, 0, 0.62))
      drop-shadow(1px 0 0 rgba(0, 0, 0, 0.62))
      drop-shadow(0 -1px 0 rgba(0, 0, 0, 0.62))
      drop-shadow(0 1px 0 rgba(0, 0, 0, 0.62))
      drop-shadow(0 0 6px rgba(235, 250, 255, 0.85))
      drop-shadow(0 0 16px rgba(140, 210, 255, 0.5))
      drop-shadow(0 0 28px rgba(170, 220, 255, 0.22));
    opacity: 0;
    animation: heart-char-appear 0.55s ease var(--d) both;
  }

  @keyframes heart-char-appear {
    0% { transform: scale(0.82); opacity: 0; }
    100% { transform: scale(1); opacity: 0.78; }
  }

  .headline {
    position: fixed;
    top: 9vh;
    left: 0;
    right: 0;
    z-index: 9;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: baseline;
    padding: 0 16px;
    pointer-events: none;
  }

  .headline .seg {
    position: relative;
    display: inline-block;
    white-space: nowrap;
    margin: 0 0.06em;
    font-family: "华文行楷", "STXingkai", "楷体", "KaiTi", "华文隶书", "STLiti", cursive;
    font-size: clamp(26px, 5.2vmin, 56px);
    font-weight: 700;
    letter-spacing: 0.03em;
    background: linear-gradient(110deg, #ffffff 0%, #eef8ff 20%, #cfeaff 38%, #9ed8ff 55%, #d7ecff 74%, #ffffff 100%);
    background-size: 100% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 7px rgba(235, 250, 255, 0.95)) drop-shadow(0 0 20px rgba(140, 210, 255, 0.6)) drop-shadow(0 0 34px rgba(170, 220, 255, 0.22));
    animation: seg-appear 0.6s ease var(--delay) both;
  }

  .headline .space {
    flex: none;
    font-size: clamp(26px, 5.2vmin, 56px);
    white-space: pre;
  }

  .headline.bottom {
    top: auto;
    bottom: 7vh;
  }

  .headline.bottom .seg {
    font-size: clamp(26px, 5.2vmin, 56px);
  }

  .headline.bottom .space {
    font-size: clamp(26px, 5.2vmin, 56px);
  }

  @keyframes seg-appear {
    0% { transform: scale(0.82); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .spark {
    position: fixed;
    z-index: 10;
    width: var(--size);
    height: var(--size);
    border-radius: 50%;
    background: var(--color);
    box-shadow: 0 0 9px 2px var(--color);
    opacity: 0;
    pointer-events: none;
    will-change: transform, opacity;
    animation: spark-fly var(--dur) ease-out var(--delay) forwards;
  }

  @keyframes spark-fly {
    0% { transform: translate(-50%, -50%) scale(0.35); opacity: 0; }
    18% { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.75); opacity: 0; }
  }

  .music-toggle {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 11;
    padding: 10px 16px;
    border: 1px solid rgba(255, 255, 255, 0.28);
    border-radius: 999px;
    background: rgba(30, 10, 34, 0.55);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    letter-spacing: 0.04em;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: background 0.2s, border-color 0.2s;
  }

  .music-toggle:hover {
    background: rgba(50, 15, 50, 0.75);
    border-color: rgba(255, 140, 175, 0.6);
  }

  .mascot {
    position: fixed;
    left: 12px;
    bottom: 10px;
    z-index: 51;
    width: 130px;
    height: 164px;
    filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.35));
    animation: mascot-wave 2s ease-in-out infinite;
  }

  .mascot svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  .mascot svg .m-line {
    stroke-dasharray: 500;
    stroke-dashoffset: 500;
    animation: draw-line 0.4s ease forwards;
    animation-delay: var(--d);
  }

  .mascot svg .m-fill {
    opacity: 0;
    animation: fadein 0.25s ease forwards;
    animation-delay: var(--d);
  }

  @keyframes draw-line {
    to { stroke-dashoffset: 0; }
  }

  @keyframes mascot-wave {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-4px) rotate(3deg); }
  }

  .biu-heart {
    position: fixed;
    left: 62px;
    bottom: 74px;
    z-index: 13;
    font-size: 18px;
    pointer-events: none;
    animation: biu-fly 1.1s ease-out forwards;
  }

  .biu-heart .biu-text {
    position: absolute;
    left: 20px;
    top: -6px;
    font-size: 12px;
    color: #ffe3ec;
    white-space: nowrap;
    text-shadow: 0 0 8px rgba(255, 120, 160, 0.9);
  }

  @keyframes biu-fly {
    0% { transform: translate(0, 0) scale(0.6); opacity: 1; }
    15% { transform: translate(8px, -18px) scale(1); opacity: 1; }
    100% { transform: translate(170px, -260px) scale(0.9); opacity: 0; }
  }

</style>
</head>
<body>
  <div id="white-cover" class="white-cover"></div>
  <canvas id="hearts"></canvas>

  <div class="stage">
    <div class="ring-scene">
      <div class="ring">
        <div class="photo-wrap" style="--a:0deg; --fd:2s;">
          <div class="photo-face"><div class="photo-card"><img src="1.png" alt="照片1"></div></div>
          <div class="photo-face back"><div class="photo-card"><img src="1.png" alt="照片1"></div></div>
        </div>
        <div class="photo-wrap" style="--a:60deg; --fd:2.8s;">
          <div class="photo-face"><div class="photo-card"><img src="2.jpg" alt="照片2"></div></div>
          <div class="photo-face back"><div class="photo-card"><img src="2.jpg" alt="照片2"></div></div>
        </div>
        <div class="photo-wrap" style="--a:120deg; --fd:3.6s;">
          <div class="photo-face"><div class="photo-card"><img src="3.png" alt="照片3"></div></div>
          <div class="photo-face back"><div class="photo-card"><img src="3.png" alt="照片3"></div></div>
        </div>
        <div class="photo-wrap" style="--a:180deg; --fd:4.4s;">
          <div class="photo-face"><div class="photo-card"><img src="4.jpg" alt="照片4"></div></div>
          <div class="photo-face back"><div class="photo-card"><img src="4.jpg" alt="照片4"></div></div>
        </div>
        <div class="photo-wrap" style="--a:240deg; --fd:5.2s;">
          <div class="photo-face"><div class="photo-card"><img src="5.png" alt="照片5"></div></div>
          <div class="photo-face back"><div class="photo-card"><img src="5.png" alt="照片5"></div></div>
        </div>
        <div class="photo-wrap" style="--a:300deg; --fd:6s;">
          <div class="photo-face"><div class="photo-card"><img src="6.png" alt="照片6"></div></div>
          <div class="photo-face back"><div class="photo-card"><img src="6.png" alt="照片6"></div></div>
        </div>
      </div>
    </div>

    <div class="heart-particle">
      <canvas id="heartCanvas"></canvas>
      <div class="heart-text" id="heart-text"></div>
    </div>
  </div>

  <div class="headline" id="headline"></div>
  <div class="headline bottom" id="headline-bottom"></div>

  <audio id="bgm" src="偏爱.mp3" loop preload="auto"></audio>

  <button id="music-toggle" class="music-toggle">🎵 播放音乐</button>

  <div class="mascot" id="mascot">
    <svg viewBox="0 0 120 150" aria-hidden="true">
      <circle class="m-line" style="--d:0s" cx="60" cy="38" r="22" fill="none" stroke="#ffd6e0" stroke-width="4"/>
      <path class="m-line" style="--d:.2s" d="M42 30 Q60 12 78 30" fill="none" stroke="#ffd6e0" stroke-width="4" stroke-linecap="round"/>
      <path class="m-line" style="--d:.35s" d="M47 21 Q60 11 73 21" fill="none" stroke="#ffd6e0" stroke-width="3" stroke-linecap="round"/>
      <path class="m-line" style="--d:.5s" d="M60 60 L60 100" stroke="#ffd6e0" stroke-width="4" stroke-linecap="round"/>
      <path class="m-line" style="--d:.7s" d="M60 68 L38 88" stroke="#ffd6e0" stroke-width="4" stroke-linecap="round"/>
      <path class="m-line" style="--d:.85s" d="M60 68 L84 44" stroke="#ffd6e0" stroke-width="4" stroke-linecap="round"/>
      <path class="m-line" style="--d:1s" d="M60 100 L44 128" stroke="#ffd6e0" stroke-width="4" stroke-linecap="round"/>
      <path class="m-line" style="--d:1.15s" d="M60 100 L76 128" stroke="#ffd6e0" stroke-width="4" stroke-linecap="round"/>
      <path class="m-line" style="--d:1.3s" d="M52 45 Q60 52 68 45" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <circle class="m-fill" style="--d:1.5s" cx="52" cy="34" r="2.2" fill="#fff"/>
      <circle class="m-fill" style="--d:1.5s" cx="68" cy="34" r="2.2" fill="#fff"/>
      <path class="m-fill" style="--d:1.7s" d="M86 42 C81 36 76 33 74 36 C72 39 75 45 86 52 C97 45 100 39 98 36 C96 33 91 36 86 42 Z" fill="#ff5c77"/>
    </svg>
  </div>

  <script>
    // 铺满屏幕的下落元素：偏长深红爱心 + 竖排 LOVE
    const canvas = document.getElementById("hearts");
    const ctx = canvas.getContext("2d");
    let W, H;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    // 白屏开场：小人画完、第一张照片出现时（约 2s）淡出白屏，场景随之显现
    const cover = document.getElementById("white-cover");
    setTimeout(() => cover.classList.add("hidden"), 2000);

    const heartColors = ["#a4161a", "#c1121f", "#8e0e16", "#d62839"];
    const snowColors = ["#ffffff", "#eaf6ff", "#d8efff", "#cfe7ff"];
    const items = [];

    const loveLetters = ["L", "O", "V", "E"];

    function makeOffscreenCanvas(w, h) {
      const c = document.createElement("canvas");
      c.width = w;
      c.height = h;
      return c;
    }

    function buildHeartSprite(color) {
      const s = 64;
      const c = makeOffscreenCanvas(s, s);
      const g = c.getContext("2d");
      g.translate(s / 2, s / 2);
      g.scale(s / 2, s / 2);
      g.beginPath();
      g.moveTo(0, 0.9);
      g.bezierCurveTo(-1.0, 0.2, -0.8, -0.9, 0, -0.35);
      g.bezierCurveTo(0.8, -0.9, 1.0, 0.2, 0, 0.9);
      g.closePath();
      g.fillStyle = color;
      g.fill();
      return c;
    }

    function buildSnowSprite(color) {
      const s = 64;
      const c = makeOffscreenCanvas(s, s);
      const g = c.getContext("2d");
      const baseR = s * 0.38;
      g.translate(s / 2, s / 2);
      g.strokeStyle = color;
      g.lineWidth = Math.max(1, baseR * 0.14);
      g.lineCap = "round";
      g.beginPath();
      for (let i = 0; i < 6; i++) {
        const angle = (Math.PI * 2 * i) / 6;
        const dx = Math.cos(angle);
        const dy = Math.sin(angle);
        g.moveTo(0, 0);
        g.lineTo(dx * baseR, dy * baseR);

        const branch1 = angle + Math.PI / 6;
        const branch2 = angle - Math.PI / 6;
        g.moveTo(dx * baseR * 0.55, dy * baseR * 0.55);
        g.lineTo(Math.cos(branch1) * baseR * 0.75, Math.sin(branch1) * baseR * 0.75);
        g.moveTo(dx * baseR * 0.55, dy * baseR * 0.55);
        g.lineTo(Math.cos(branch2) * baseR * 0.75, Math.sin(branch2) * baseR * 0.75);
      }
      g.stroke();
      return c;
    }

    function buildLetterSprite(letter) {
      const s = 80;
      const c = makeOffscreenCanvas(s, s);
      const g = c.getContext("2d");
      g.fillStyle = "#ff9eb5";
      g.font = "bold 58px 'Segoe Script', 'Lucida Handwriting', 'Brush Script MT', cursive";
      g.textAlign = "center";
      g.textBaseline = "middle";
      g.fillText(letter, s / 2, s / 2);
      return c;
    }

    const heartSprites = new Map(heartColors.map((color) => [color, buildHeartSprite(color)]));
    const snowSprites = new Map(snowColors.map((color) => [color, buildSnowSprite(color)]));
    const letterSprites = new Map(loveLetters.map((letter) => [letter, buildLetterSprite(letter)]));

    function drawHeart(x, y, w, h, color, alpha) {
      ctx.globalAlpha = alpha;
      ctx.drawImage(heartSprites.get(color), x - w / 2, y - h / 2, w, h);
    }

    function drawSnowflake(x, y, r, alpha, color) {
      ctx.globalAlpha = alpha;
      ctx.drawImage(snowSprites.get(color), x - r, y - r, r * 2, r * 2);
    }

    let loveDrops = [];
    const loveColGap = 50;
    const dropsPerCol = 7;
    let loveFontSize = 16;

    function drawLoveLetter(letter, x, y, size, alpha) {
      ctx.globalAlpha = alpha;
      ctx.drawImage(letterSprites.get(letter), x - size / 2, y - size / 2, size, size);
    }

    function initLoveDrops(startOffset) {
      loveDrops = [];
      loveFontSize = Math.max(14, Math.min(20, W / 55));
      const cols = Math.max(1, Math.floor(W / loveColGap));
      const spacing = W / cols;
      const now = performance.now();
      for (let i = 0; i < cols; i++) {
        const x = spacing * (i + 0.5);
        const speed = 2.2 + Math.random() * 1.4;
        for (let k = 0; k < dropsPerCol; k++) {
          loveDrops.push({
            x: x,
          y: loveFontSize + k * (H / dropsPerCol) + Math.random() * 35,
          speed: speed,
          size: loveFontSize + Math.random() * 3,
          revealInterval: 200 + Math.random() * 80,
          startTime: now + startOffset + Math.random() * 700
        });
      }
      }
    }

    function updateLoveDrops(now) {
      for (const drop of loveDrops) {
        const elapsed = now - drop.startTime;
        if (elapsed < 0) continue;

        drop.y += drop.speed;
        const gap = drop.size * 1.15;
        const visible = Math.min(loveLetters.length, Math.floor(elapsed / drop.revealInterval) + 1);

        for (let j = 0; j < visible; j++) {
          const ly = drop.y + j * gap;
          if (ly < -drop.size || ly > H + drop.size) continue;
          drawLoveLetter(loveLetters[j], drop.x, ly, drop.size, 0.95);
        }

        if (drop.y > H + drop.size * 5) {
          drop.y = -drop.size * 5 - Math.random() * 100;
          drop.startTime = now + Math.random() * 300;
          drop.revealInterval = 200 + Math.random() * 80;
        }
      }
    }

    window.addEventListener("resize", () => initLoveDrops(0));
    initLoveDrops(2000);

    function makeItem(y) {
      if (Math.random() < 0.5) {
        const w = 8 + Math.random() * 13;
        return {
          type: "heart",
          x: Math.random() * W,
          y: y,
          w: w,
          h: w * 1.55,
          speed: 2.2 + Math.random() * 3.6,
          opacity: 0.4 + Math.random() * 0.6,
          color: heartColors[Math.floor(Math.random() * heartColors.length)]
        };
      }

      return {
        type: "snow",
        x: Math.random() * W,
        y: y,
        r: 5 + Math.random() * 7,
        speed: 2.0 + Math.random() * 3.6,
        opacity: 0.45 + Math.random() * 0.55,
        color: snowColors[Math.floor(Math.random() * snowColors.length)]
      };
    }

    function desiredItemCount() {
      return Math.max(90, Math.min(320, Math.floor((W * H) / 8500)));
    }

    function syncItemCount() {
      const target = desiredItemCount();
      while (items.length > target) items.pop();
      while (items.length < target) items.push(makeItem(Math.random() * H));
    }

    for (let i = 0; i < desiredItemCount(); i++) {
      items.push(makeItem(Math.random() * H));
    }
    window.addEventListener("resize", syncItemCount);

    function tick(now) {
      ctx.clearRect(0, 0, W, H);
      for (const it of items) {
        it.y += it.speed;
        if (it.type === "heart") {
          drawHeart(it.x, it.y, it.w, it.h, it.color, it.opacity);
        } else {
          drawSnowflake(it.x, it.y, it.r, it.opacity, it.color);
        }
        if (it.y > H + 120) {
          Object.assign(it, makeItem(-80));
        }
      }
      updateLoveDrops(now || performance.now());
      ctx.globalAlpha = 1;
      requestAnimationFrame(tick);
    }
    setTimeout(() => requestAnimationFrame(tick), 2000);

    // 粒子爱心：由许多小粒子组成，微微闪烁
    const heartCanvas = document.getElementById("heartCanvas");
    const hctx = heartCanvas.getContext("2d");
    const particleColors = ["#ffffff", "#f5f0ff", "#e7c6ff", "#c8a2f8", "#9ed8ff", "#7fc8ff", "#ffd6e0", "#ff8fa3"];
    let heartParticles = [];

    function heartPathInCanvas(w, h) {
      const p = new Path2D();
      const cx = w / 2;
      const cy = h / 2;
      const sx = w / 2.05;
      const sy = h / 1.95;
      p.moveTo(cx, cy + 0.85 * sy);
      p.bezierCurveTo(cx - 1.0 * sx, cy + 0.15 * sy, cx - 0.85 * sx, cy - 0.95 * sy, cx, cy - 0.25 * sy);
      p.bezierCurveTo(cx + 0.85 * sx, cy - 0.95 * sy, cx + 1.0 * sx, cy + 0.15 * sy, cx, cy + 0.85 * sy);
      p.closePath();
      return p;
    }

    function buildHeartParticles(w, h) {
      const p = heartPathInCanvas(w, h);
      heartParticles = [];
      let guard = 0;
      const target = Math.max(320, Math.min(1200, Math.floor((w * h) / 380)));
      while (heartParticles.length < target && guard < 100000) {
        guard++;
        const x = Math.random() * w;
        const y = Math.random() * h;
        if (hctx.isPointInPath(p, x, y)) {
          heartParticles.push({
            x: x,
            y: y,
            r: 0.9 + Math.random() * 1.8,
            phase: Math.random() * Math.PI * 2,
            color: particleColors[Math.floor(Math.random() * particleColors.length)]
          });
        }
      }
      heartParticles.sort((a, b) => a.color.localeCompare(b.color));
    }

    function resizeHeartCanvas() {
      const rect = heartCanvas.getBoundingClientRect();
      heartCanvas.width = Math.max(1, Math.round(rect.width));
      heartCanvas.height = Math.max(1, Math.round(rect.height));
      buildHeartParticles(heartCanvas.width, heartCanvas.height);
    }
    window.addEventListener("resize", resizeHeartCanvas);
    resizeHeartCanvas();

    function heartTick(t) {
      const w = heartCanvas.width;
      const h = heartCanvas.height;
      hctx.clearRect(0, 0, w, h);

      let lastColor = "";
      for (const p of heartParticles) {
        const a = 0.3 + 0.65 * (0.5 + 0.5 * Math.sin(t / 500 + p.phase));
        const jx = Math.sin(t / 900 + p.phase) * 0.8;
        const jy = Math.cos(t / 700 + p.phase * 1.3) * 0.8;
        hctx.globalAlpha = a;
        if (p.color !== lastColor) {
          hctx.fillStyle = p.color;
          lastColor = p.color;
        }
        hctx.beginPath();
        hctx.arc(p.x + jx, p.y + jy, p.r, 0, Math.PI * 2);
        hctx.fill();
      }
      hctx.globalAlpha = 1;
      requestAnimationFrame(heartTick);
    }
    setTimeout(() => requestAnimationFrame(heartTick), 2000);

    // 音乐：等白屏约 2 秒后变成爱心画面时，自动开始播放
    const audio = document.getElementById("bgm");
    const musicBtn = document.getElementById("music-toggle");
    audio.volume = 0.45;

    function markPlaying() {
      musicBtn.textContent = "🔊 音乐中";
    }

    function playWithSound() {
      audio.muted = false;
      const p = audio.play();
      if (p && p.catch) {
        p.then(markPlaying).catch(() => {
          // 浏览器禁止有声自动播放时，先静音播放以保持画面同步
          audio.muted = true;
          audio.play().then(() => {
            // 再尝试取消静音；部分浏览器仍会要求用户先点击一次
            setTimeout(() => {
              audio.muted = false;
              if (audio.paused) {
                audio.play().then(markPlaying).catch(() => {});
              } else if (!audio.muted) {
                markPlaying();
              }
            }, 150);
          }).catch(() => {});
        });
      } else {
        markPlaying();
      }
    }

    // 白屏淡出（约 2s）和爱心画面出现是同一时间点
    setTimeout(playWithSound, 2000);

    document.addEventListener("pointerdown", () => {
      if (audio.paused || audio.muted) {
        audio.muted = false;
        audio.play().then(markPlaying).catch(() => {});
      }
    });

    musicBtn.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      if (audio.paused) {
        audio.muted = false;
        audio.play().then(markPlaying).catch(() => {});
      } else {
        audio.pause();
        musicBtn.textContent = "🎵 播放音乐";
      }
    });

    // 左下角小人发射 biu 爱心
    function shootBiu() {
      const el = document.createElement("div");
      el.className = "biu-heart";
      el.innerHTML = '<span class="biu-heart-emoji">❤️</span><span class="biu-text">biu!</span>';
      document.body.appendChild(el);
      el.addEventListener("animationend", () => el.remove());
    }
    shootBiu();
    setInterval(shootBiu, 1400);

    // 顶部文字依次出现：不同动画 + 粒子迸发
    const headline = document.getElementById("headline");
    const text = "某天 我也会成为你轻描淡写的一页";
    const baseDelay = 2.7;
    const stagger = 0.22;

    function spawnSparks(seg) {
      const rect = seg.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const colors = ["#ff4d6d", "#ff8fa3", "#ffb3c1", "#ffd6e0", "#ffffff", "#ff5c77"];
      const count = 10;
      for (let i = 0; i < count; i++) {
        const spark = document.createElement("span");
        spark.className = "spark";
        const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
        const dist = 32 + Math.random() * 55;
        const size = 2 + Math.random() * 5;
        spark.style.left = cx + "px";
        spark.style.top = cy + "px";
        spark.style.setProperty("--dx", (Math.cos(angle) * dist).toFixed(1) + "px");
        spark.style.setProperty("--dy", (Math.sin(angle) * dist).toFixed(1) + "px");
        spark.style.setProperty("--size", size.toFixed(1) + "px");
        spark.style.setProperty("--dur", (0.7 + Math.random() * 0.8).toFixed(2) + "s");
        spark.style.setProperty("--delay", (Math.random() * 0.2).toFixed(2) + "s");
        spark.style.setProperty("--color", colors[Math.floor(Math.random() * colors.length)]);
        document.body.appendChild(spark);
        spark.addEventListener("animationend", () => spark.remove());
      }
    }

    let charIndex = 0;
    Array.from(text).forEach((ch) => {
      if (ch === " ") {
        const space = document.createElement("span");
        space.className = "space";
        space.textContent = " ";
        headline.appendChild(space);
        return;
      }

      const delay = baseDelay + charIndex * stagger;
      const seg = document.createElement("span");
      seg.className = "seg";
      seg.textContent = ch;
      seg.style.setProperty("--delay", delay.toFixed(2) + "s");
      headline.appendChild(seg);
      setTimeout(() => spawnSparks(seg), delay * 1000 + 240);
      charIndex++;
    });

    const headlineBottom = document.getElementById("headline-bottom");
    const bottomText = "可我会把你 写进余生的每一页";
    const bottomBaseDelay = 4.4;
    const bottomStagger = 0.22;
    let bottomCharIndex = 0;
    Array.from(bottomText).forEach((ch) => {
      if (ch === " ") {
        const space = document.createElement("span");
        space.className = "space";
        space.textContent = " ";
        headlineBottom.appendChild(space);
        return;
      }

      const delay = bottomBaseDelay + bottomCharIndex * bottomStagger;
      const seg = document.createElement("span");
      seg.className = "seg";
      seg.textContent = ch;
      seg.style.setProperty("--delay", delay.toFixed(2) + "s");
      headlineBottom.appendChild(seg);
      setTimeout(() => spawnSparks(seg), delay * 1000 + 240);
      bottomCharIndex++;
    });

    const heartText = document.getElementById("heart-text");
    Array.from("祈愿冰雪无忧").forEach((ch, i) => {
      const span = document.createElement("span");
      span.className = "heart-char";
      span.textContent = ch;
      span.style.setProperty("--d", (2.2 + i * 0.18).toFixed(2) + "s");
      heartText.appendChild(span);
    });
  </script>
</body>
</html>
